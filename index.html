<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rajalakshmi | Portfolio</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
    font-family: Arial, sans-serif;
}

body {
    background: #f7f8fc;
    color: #172033;
}

/* Navigation */
nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #10182b;
    padding: 18px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 12px;
    font-size: 15px;
}

nav a:hover {
    color: #8b7cff;
}

/* Home */
.hero {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 50px;
    padding: 70px 10%;
    background: linear-gradient(135deg, #eef0ff, #ffffff);
}

.hero-text {
    flex: 1;
}

.hero-text p:first-child {
    color: #5b4ee8;
    font-weight: bold;
    font-size: 20px;
}

.hero h1 {
    font-size: 55px;
    margin: 12px 0;
}

.hero h2 {
    color: #5b4ee8;
    margin-bottom: 20px;
}

.hero-description {
    line-height: 1.7;
    max-width: 550px;
    color: #555;
}

.profile {
    width: 300px;
    height: 300px;
    object-fit: cover;
    object-position: center top;
    border-radius: 50%;
    border: 8px solid white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.buttons {
    margin-top: 30px;
}

.button {
    display: inline-block;
    padding: 13px 24px;
    margin-right: 10px;
    border-radius: 25px;
    background: #5b4ee8;
    color: white;
    text-decoration: none;
}

.button.secondary {
    background: transparent;
    color: #5b4ee8;
    border: 2px solid #5b4ee8;
}

/* Sections */
section {
    padding: 70px 10%;
}

section h2 {
    text-align: center;
    font-size: 32px;
    margin-bottom: 35px;
}

/* About */
.about {
    max-width: 800px;
    margin: auto;
    text-align: center;
    line-height: 1.8;
    color: #555;
}

/* Skills */
.skills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
}

.skill {
    background: white;
    padding: 15px 25px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

/* Education */
.education {
    background: #eef0ff;
}

.education-container {
    max-width: 900px;
    margin: auto;
    display: flex;
    gap: 25px;
    justify-content: center;
}

.education-card {
    background: white;
    flex: 1;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    text-align: center;
}

.education-icon {
    font-size: 40px;
    margin-bottom: 15px;
}

.education-card h3 {
    color: #5b4ee8;
    margin-bottom: 12px;
    line-height: 1.4;
}

.education-card p {
    line-height: 1.7;
    color: #555;
}

.education-year {
    display: inline-block;
    margin-top: 15px;
    padding: 7px 15px;
    border-radius: 20px;
    background: #eef0ff;
    color: #5b4ee8;
    font-weight: bold;
}

/* Projects */
.projects {
    max-width: 900px;
    margin: auto;
}

.project {
    background: white;
    padding: 25px;
    margin: 20px 0;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.project h3 {
    color: #5b4ee8;
    margin-bottom: 10px;
}

.project p {
    line-height: 1.7;
    color: #555;
}

/* Contact */
.contact {
    text-align: center;
    background: #10182b;
    color: white;
}

.contact h2 {
    color: white;
}

.contact a {
    color: #a9a0ff;
    text-decoration: none;
}

.contact a:hover {
    text-decoration: underline;
}

/* Footer */
footer {
    background: #0b1020;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Mobile */
@media (max-width: 700px) {

    .hero {
        flex-direction: column-reverse;
        text-align: center;
        padding: 50px 25px;
    }

    .hero h1 {
        font-size: 40px;
    }

    .profile {
        width: 230px;
        height: 230px;
    }

    .hero-description {
        margin: auto;
    }

    nav a {
        margin: 0 6px;
        font-size: 13px;
    }

    section {
        padding: 55px 25px;
    }

    .education-container {
        flex-direction: column;
    }

    .education-card {
        width: 100%;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#education">Education</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</
